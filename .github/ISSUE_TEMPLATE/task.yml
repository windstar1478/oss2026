name: New Issue
description: 새로운 기능 개발 및 작업 내용을 등록합니다.
title: "[Feat] "
labels: []
assignees: []

body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 작업을 진행하는 이유와 목표를 작성합니다.
      placeholder: 작업의 목적과 필요한 이유를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 구체적으로 수행할 작업을 작성합니다.
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: 완료 기준
      description: 작업이 완료되었다고 판단할 기준을 작성합니다.
      placeholder: |
        - [ ] 완료 기준 1
        - [ ] 완료 기준 2
    validations:
      required: true
